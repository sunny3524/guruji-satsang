<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Self-healing mechanism to recover from stale service worker cache or chunk loading failures
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn("Asset failed to load, healing cache and reloading...", e.target.src || e.target.href);
          healAndReload();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        const msg = e.reason && e.reason.message;
        if (msg && (msg.indexOf('dynamically imported module') > -1 || msg.indexOf('Failed to fetch') > -1)) {
          console.warn("Chunk load error detected, healing cache and reloading...", msg);
          healAndReload();
        }
      });
      function healAndReload() {
        const lastReload = localStorage.getItem('sw-heal-reload');
        const now = Date.now();
        if (lastReload && (now - parseInt(lastReload, 10) < 6000)) return; // prevent loop
        localStorage.setItem('sw-heal-reload', now.toString());
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (let r of regs) r.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (let k of keys) caches.delete(k);
          });
        }
        setTimeout(function() { window.location.reload(true); }, 150);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>Guruji Satsangs</title>
    <meta name="description" content="Find and host Guruji Satsangs near you. Register attendance, offer Seva, and connect with the Sangat." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a0800" />
    <link rel="apple-touch-icon" href="/guruji-01.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <!-- Leaflet CSS & JS CDNs for global interactive map integration -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      :root {
        --color-bg: #1a0800;
        --color-bg-darker: #0f0500;
        --color-card: #270e03;
        --color-border: #5c2a0a;
        --color-gold: #d4972a;
        --color-saffron: #e06b10;
        --color-cream: #fdfbf7;
        --color-muted: #9c7050;
        --color-red: #722f37;
        --color-burgundy: hsl(353, 42%, 32%);
        --color-menu-bg: rgba(39, 14, 3, 0.98);
        --color-menu-shadow: 0 24px 64px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        --font-headings: 'Outfit', sans-serif;
        --font-body: 'Inter', sans-serif;
      }
      :root.theme-light {
        --color-bg: #fdfbf7;
        --color-bg-darker: #f4ecd8;
        --color-card: #ffffff;
        --color-border: #e4d4c8;
        --color-gold: #9e6403;
        --color-saffron: #c85600;
        --color-cream: #1a0800;
        --color-muted: #72503a;
        --color-red: #8b2d37;
        --color-burgundy: hsl(353, 42%, 40%);
        --color-menu-bg: rgba(255, 255, 255, 0.98);
        --color-menu-shadow: 0 12px 32px rgba(142, 112, 90, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.05) inset;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--color-bg);
        color: var(--color-cream);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background 0.3s ease, color 0.3s ease;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-headings);
      }
      button { font-family: inherit; }

      /* Smooth Collapsible Accordion Panels */
      .panel-collapse {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      .panel-collapse.open {
        grid-template-rows: 1fr;
      }
      .panel-collapse-inner {
        min-height: 0;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.25s ease-out, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .panel-collapse.open .panel-collapse-inner {
        opacity: 1;
        transform: translateY(0);
      }

      /* Dark Theme Leaflet Map styling */
      .leaflet-container {
        background: var(--color-bg-darker) !important;
        font-family: var(--font-body) !important;
      }
      .leaflet-tile {
        filter: invert(100%) hue-rotate(195deg) brightness(85%) contrast(115%) saturate(70%) !important;
      }
      .theme-light .leaflet-tile {
        filter: none !important;
      }
      .leaflet-bar {
        border: 1px solid var(--color-border) !important;
        box-shadow: none !important;
      }
      .leaflet-bar a {
        background-color: var(--color-card) !important;
        border-bottom: 1px solid var(--color-border) !important;
        color: var(--color-gold) !important;
        transition: all 0.2s;
      }
      .leaflet-bar a:hover {
        background-color: var(--color-bg) !important;
        color: var(--color-cream) !important;
      }
      .leaflet-popup-content-wrapper {
        background: var(--color-card) !important;
        color: var(--color-cream) !important;
        border: 1px solid var(--color-border) !important;
        border-radius: 12px !important;
        font-family: var(--font-body) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6) !important;
        padding: 4px !important;
      }
      .leaflet-popup-content {
        margin: 12px 14px !important;
        line-height: 1.5 !important;
      }
      .leaflet-popup-tip {
        background: var(--color-card) !important;
        border: 1px solid var(--color-border) !important;
      }
      .leaflet-popup-close-button {
        color: #9c7050 !important;
        padding: 8px !important;
      }

      /* Spinner & Pulse Animations */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.5; }
      }
      .spinner-pulse {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--color-gold);
        animation: pulse 1.5s infinite ease-in-out;
        display: inline-block;
      }
      .spinner {
        border: 4px solid #5c2a0a;
        border-top: 4px solid var(--color-gold);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(reg => console.log("Service Worker registered successfully:", reg.scope))
            .catch(err => console.error("Service Worker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
